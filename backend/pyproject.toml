[project]
name = "campus-recruitment-progress-backend"
version = "0.1.0"
description = "Backend service for the campus recruitment progress management system"
requires-python = ">=3.11"
dependencies = [
    "django",
    "djangorestframework",
    "djangorestframework-simplejwt",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]",
]

[dependency-groups]
dev = [
    "coverage>=7.16.1",
    "pytest-cov>=7.1.0",
]
test = [
    "coverage>=7.16.1",
    "pytest>=8.0,<9.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.9,<5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.config.settings"
pythonpath = [".."]
testpaths = ["tests"]
